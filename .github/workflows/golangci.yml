name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Run golangci-lint
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app:ro" \
            -w /app \
            golangci/golangci-lint:v2.13.1 \
            golangci-lint run --timeout=5m
